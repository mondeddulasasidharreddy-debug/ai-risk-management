<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Risk Management</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>AI Risk Management</h1>
      <p class="sub">Log the risks of your AI system, score them by likelihood and impact, and track what you are doing about each one.</p>
    </div>
    <button id="reset" title="Restore the sample risks">Reset data</button>
  </div>

  <section class="stats" id="stats" aria-label="Risk summary"></section>

  <div class="grid">
    <section class="panel">
      <h2>Risk register</h2>
      <div class="tools">
        <select id="fLevel" aria-label="Filter by level"><option value="">All levels</option><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select>
        <select id="fStatus" aria-label="Filter by status"><option value="">All statuses</option><option>Open</option><option>Mitigating</option><option>Resolved</option></select>
        <button id="csv">Download CSV</button>
      </div>
      <div class="scroll"><table>
        <thead><tr><th>Risk</th><th>Score</th><th>Mitigation</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <div id="empty" class="empty" hidden>No risks match. Add one using the form.</div>
    </section>

    <div>
      <section class="panel">
        <h2>Add a risk</h2>
        <div id="addForm">
          <label for="title">Risk</label>
          <input id="title" maxlength="90" placeholder="e.g. Model gives biased loan decisions">
          <div class="row">
            <div><label for="cat">Category</label>
              <select id="cat"><option>Bias &amp; fairness</option><option>Privacy</option><option>Security</option><option>Accuracy</option><option>Safety</option><option>Compliance</option><option>Reliability</option></select></div>
            <div><label for="owner">Owner</label><input id="owner" placeholder="Name or team"></div>
          </div>
          <div class="row">
            <div><label for="lik">Likelihood (1–5)</label><select id="lik"></select></div>
            <div><label for="imp">Impact (1–5)</label><select id="imp"></select></div>
          </div>
          <label for="mit">Mitigation</label>
          <textarea id="mit" placeholder="What will reduce this risk?"></textarea>
          <div class="preview" id="preview"></div>
          <button class="primary" id="add">Add risk</button>
        </div>
      </section>

      <section class="panel" style="margin-top:18px">
        <h2>Heat map</h2>
        <div class="heat" id="heat" aria-label="Risk heat map by likelihood and impact"></div>
      </section>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
